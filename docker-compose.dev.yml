version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: raftargadi
      POSTGRES_PASSWORD: raftargadi_dev
      POSTGRES_DB: raftargadi
    ports:
      - '15432:5432'
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U raftargadi']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - raftargadi-dev

  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: raftargadi_test
      POSTGRES_PASSWORD: raftargadi_test
      POSTGRES_DB: raftargadi_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U raftargadi_test']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - raftargadi-dev

  redis:
    image: redis:7-alpine
    ports:
      - '16379:6379'
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - raftargadi-dev

volumes:
  postgres-dev-data:
  redis-dev-data:

networks:
  raftargadi-dev:
    driver: bridge
